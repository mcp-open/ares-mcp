# CI+CD konektora: test → build → deploy (repository_dispatch `component-built`
# do mcp-open/platforma, kde CD bumpne digest v manifeste a nasadí).
#
# Org secret OPENMCP_CI_TOKEN = fine-grained PAT s contents:read na openmcp-sdk
# (checkout) a contents:write na platforma (dispatch + bump digestu).
name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:

env:
  SLUG: ares

concurrency: { group: "ci-${{ github.repository }}", cancel-in-progress: false }

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with: { path: "${{ env.SLUG }}" }

      # SDK pin žije v súbore .sdk-ref, nie v tomto workflow: bump SDK je potom
      # jednoriadkový diff v PR, ktorý sa dá reviewovať, a ten istý ref si
      # vezme aj lokálny vývoj.
      - id: sdkref
        run: echo "ref=$(tr -d '[:space:]' < "${SLUG}/.sdk-ref")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: mcp-open/openmcp-sdk
          token: ${{ secrets.OPENMCP_CI_TOKEN }}
          ref: ${{ steps.sdkref.outputs.ref }}
          path: sdk

      - name: Lint, typecheck, manifest a testy
        run: |
          docker run --rm -v "$PWD":/src -w /src python:3.13-slim sh -c '
            set -eu
            pip install -q --no-cache-dir ./sdk "./'"$SLUG"'[test]"
            ruff check '"$SLUG"'/src '"$SLUG"'/tests
            mypy '"$SLUG"'/src
            # Validuje proti SDK schéme AJ invariantom platformy, takže
            # "prešlo" znamená "platforma to prijme".
            (cd '"$SLUG"' && openmcp-sdk validate connector.yaml)
            python -m pytest '"$SLUG"'/tests -q
          '

  build:
    needs: test
    if: github.event_name != 'pull_request' # PR sa iba testuje
    runs-on: self-hosted
    outputs: { digest: "${{ steps.digest.outputs.digest }}" }
    steps:
      - uses: actions/checkout@v4
        with: { path: "${{ env.SLUG }}" }
      - id: sdkref
        run: echo "ref=$(tr -d '[:space:]' < "${SLUG}/.sdk-ref")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: mcp-open/openmcp-sdk
          token: ${{ secrets.OPENMCP_CI_TOKEN }}
          ref: ${{ steps.sdkref.outputs.ref }}
          path: sdk

      - name: Build + push
        run: |
          SHA=${GITHUB_SHA::7}
          IMG=localhost:30500/openmcp/mcp-${SLUG}
          docker build -q -f "${SLUG}/Dockerfile" -t "$IMG:dev" -t "$IMG:$SHA" .
          docker push -q "$IMG:$SHA"
          docker push -q "$IMG:dev"

      # Kontajner musí naozaj nabehnúť. Chytí zlý WORKDIR, chýbajúci
      # connector.yaml v image aj manifest, ktorý zhodí štart — teda presne to,
      # čo inak praskne až pri rollout-e.
      - name: Smoke test image
        run: |
          TOKEN=$(head -c 48 /dev/urandom | base64 | tr -d '\n')
          docker run -d --name "smoke-${SLUG}" -p 18000:8000 \
            -e OPENMCP_MODE=hosted \
            -e OPENMCP_INTERNAL_TOKEN="$TOKEN" \
            -e OPENMCP_PII_SALT=ci-smoke \
            -e VAULT_ADDR=http://127.0.0.1:8200 \
            "localhost:30500/openmcp/mcp-${SLUG}:dev"
          for _ in $(seq 30); do
            curl -sf localhost:18000/healthz && break || sleep 1
          done
          curl -sf localhost:18000/healthz || {
            docker logs "smoke-${SLUG}"; docker rm -f "smoke-${SLUG}"; exit 1;
          }
          docker rm -f "smoke-${SLUG}"

      - id: digest
        run: |
          D=$(docker inspect --format='{{index .RepoDigests 0}}' \
                "localhost:30500/openmcp/mcp-${SLUG}:dev")
          echo "digest=${D#*@}" >> "$GITHUB_OUTPUT"
          echo "**mcp-${SLUG}**: \`${D#*@}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Dispatch deploy do platforma
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.OPENMCP_CI_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/mcp-open/platforma/dispatches \
            -d "{\"event_type\":\"component-built\",\"client_payload\":{\"component\":\"mcp-${SLUG}\",\"digest\":\"${{ needs.build.outputs.digest }}\"}}"
