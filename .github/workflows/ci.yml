# CI+CD konektoru: exact source/lock test → immutable image gate → platform
# dispatch s digestem a provenancí zdrojového CI běhu. Feature-branch
# workflow_dispatch pouze testuje; build a deploy jsou povoleny výhradně pro
# push do main.
name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read

env:
  SLUG: ares

concurrency:
  group: "ci-${{ github.repository }}-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: "${{ env.SLUG }}"
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: { python-version: "3.13.9" }

      - name: Verify and materialize exact SDK source
        id: sdk
        run: |
          sdk_dir="${RUNNER_TEMP}/openmcp-sdk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python "${SLUG}/release/materialize_sdk.py" \
            --root "${SLUG}" --output "$sdk_dir"
          echo "path=$sdk_dir" >> "$GITHUB_OUTPUT"

      - name: Lint, typecheck, manifest and tests
        run: |
          set -eu
          python -m pip install -q --disable-pip-version-check \
            --only-binary=:all: --require-hashes \
            -r "${SLUG}/release/python-requirements.lock"
          python -m pip install -q --disable-pip-version-check \
            --no-deps --no-build-isolation \
            "${{ steps.sdk.outputs.path }}" "./${SLUG}"
          python -m pip check
          python -m ruff check "${SLUG}/src" "${SLUG}/tests"
          python -m mypy "${SLUG}/src"
          (cd "$SLUG" && openmcp-sdk validate connector.yaml)
          (cd "$SLUG" && python -m pytest tests -q)

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      SOURCE_DIR: ares-source
    outputs: { digest: "${{ steps.digest.outputs.digest }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: "${{ env.SOURCE_DIR }}"
          persist-credentials: false

      - name: Verify self-hosted build interpreter
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 12), sys.version'
          python3 --version

      - name: Prepare isolated build context with exact SDK source
        id: context
        run: |
          build_context="${RUNNER_TEMP}/openmcp-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$build_context/${SLUG}"
          git -C "${SOURCE_DIR}" archive HEAD | tar -x -C "$build_context/${SLUG}"
          cp "${SOURCE_DIR}/.dockerignore" "$build_context/.dockerignore"
          python3 "${SOURCE_DIR}/release/materialize_sdk.py" \
            --root "${SOURCE_DIR}" --output "$build_context/sdk"
          echo "path=$build_context" >> "$GITHUB_OUTPUT"

      - name: Build candidate
        run: |
          set -eu
          SHA=${GITHUB_SHA::7}
          IMG=localhost:30500/openmcp/mcp-${SLUG}
          docker build -q \
            -f "${{ steps.context.outputs.path }}/${SLUG}/Dockerfile" \
            -t "$IMG:$SHA" "${{ steps.context.outputs.path }}"

      - name: Scan candidate
        run: |
          set -eu
          SHA=${GITHUB_SHA::7}
          IMG=localhost:30500/openmcp/mcp-${SLUG}
          trivy image --scanners vuln,secret --severity HIGH,CRITICAL \
            --exit-code 1 "$IMG:$SHA"

      - name: Smoke test image
        run: |
          set -eu
          SHA=${GITHUB_SHA::7}
          IMG=localhost:30500/openmcp/mcp-${SLUG}
          SMOKE="smoke-${SLUG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$SMOKE" >/dev/null 2>&1 || true' EXIT
          TOKEN=$(head -c 48 /dev/urandom | base64 | tr -d '\n')
          SAFE_TEST_TOKEN=$(head -c 48 /dev/urandom | base64 | tr -d '\n')
          docker run -d --name "$SMOKE" -p 127.0.0.1::8000 \
            -e OPENMCP_MODE=hosted \
            -e OPENMCP_INTERNAL_TOKEN="$TOKEN" \
            -e OPENMCP_PUBLIC_SAFE_TEST_TOKEN="$SAFE_TEST_TOKEN" \
            -e OPENMCP_PII_SALT=ci-smoke \
            -e VAULT_ADDR=http://127.0.0.1:8200 \
            "$IMG:$SHA"
          PORT=$(docker port "$SMOKE" 8000/tcp | sed 's/.*://')
          for _ in $(seq 30); do
            curl -sf "127.0.0.1:$PORT/healthz" && break || sleep 1
          done
          curl -sf "127.0.0.1:$PORT/healthz" || {
            docker logs "$SMOKE"; exit 1;
          }

      - name: Push verified image
        run: |
          set -eu
          SHA=${GITHUB_SHA::7}
          IMG=localhost:30500/openmcp/mcp-${SLUG}
          docker tag "$IMG:$SHA" "$IMG:dev"
          docker push -q "$IMG:$SHA"
          docker push -q "$IMG:dev"

      - id: digest
        run: |
          D=$(docker inspect --format='{{index .RepoDigests 0}}' \
                "localhost:30500/openmcp/mcp-${SLUG}:dev")
          echo "digest=${D#*@}" >> "$GITHUB_OUTPUT"
          echo "**mcp-${SLUG}**: \`${D#*@}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Dispatch deploy to platform
        env:
          DIGEST: "${{ needs.build.outputs.digest }}"
          SOURCE_RUN_ID: "${{ github.run_id }}"
          SOURCE_RUN_ATTEMPT: "${{ github.run_attempt }}"
        run: |
          set -eu
          printf '%s' "$SLUG" | grep -Eq '^[a-z0-9][a-z0-9-]*$'
          printf '%s' "$DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'
          printf '%s' "$SOURCE_RUN_ID" | grep -Eq '^[1-9][0-9]{0,17}$'
          printf '%s' "$SOURCE_RUN_ATTEMPT" | grep -Eq '^[1-9][0-9]{0,8}$'
          PAYLOAD=$(printf \
            '{"event_type":"component-built","client_payload":{"component":"mcp-%s","digest":"%s","source_run_id":"%s","source_run_attempt":"%s"}}' \
            "$SLUG" "$DIGEST" "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT")
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.OPENMCP_CI_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/mcp-open/platforma/dispatches \
            --data "$PAYLOAD"
