# Noční běh testů proti SDK `main` namísto pinu z `.sdk-ref`.
#
# Pin bez kanárka znamená, že se rozjezd objeví až při bumpu — tehdy je
# největší a nejhůř se bisektuje. Selhání tu neblokuje merge, jen otevře
# issue.
name: SDK canary

on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:

env:
  SLUG: ares

jobs:
  canary:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with: { path: "${{ env.SLUG }}" }
      - uses: actions/checkout@v4
        with:
          repository: mcp-open/openmcp-sdk
          token: ${{ secrets.OPENMCP_CI_TOKEN }}
          ref: main
          path: sdk
      - id: run
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/src -w /src python:3.13-slim sh -c '
            set -eu
            pip install -q --no-cache-dir ./sdk "./'"$SLUG"'[test]"
            (cd '"$SLUG"' && openmcp-sdk validate connector.yaml)
            python -m pytest '"$SLUG"'/tests -q
          '
      - if: steps.run.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `SDK canary: ${process.env.SLUG} není kompatibilní s openmcp-sdk@main`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'sdk-canary',
            });
            const body = `Noční běh proti \`openmcp-sdk@main\` selhal.\n\n`
              + `Běh: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`
              + `/actions/runs/${context.runId}`;
            if (issues.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['sdk-canary'],
              });
            }
