[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ares-mcp"
version = "0.2.2"
description = "Referenční no-secret MCP connector nad ARES (R1-WP06)."
requires-python = ">=3.12"
# openmcp-sdk se nepublikuje na PyPI — jméno tam patří nesouvisejícímu
# projektu, jehož nejvyšší verze je 0.2.20, takže `pip install` na tomhle
# balíku selhal s „No solution found" a po vydání cizí 0.4.x by dokonce
# nainstaloval cizí kód. Reference proto míří přímo na commit, který je
# zároveň v `.sdk-ref` a ve vendorovaném snapshotu v `release/vendor/`;
# shodu hlídá `tests/test_sdk_pin.py`.
dependencies = [
  "openmcp-sdk @ git+https://github.com/mcp-open/openmcp-sdk@0d36cf1a93c870fe237ecbe3bee7b52b202df18d",
  "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
# CI je dosud instalovalo ad hoc v run kroku — deklarované jsou ověřitelné
# a `pip install -e .[test]` stačí na lokální spuštění celé sady.
test = [
  "pytest==9.0.3",
  "pyyaml==6.0.2",
  "anyio>=4,<6",
  "ruff==0.15.22",
  "mypy==1.20.2",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["connector"]
