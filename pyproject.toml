[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-ares"
version = "0.2.1"
description = "Referenčný no-secret MCP connector nad ARES (R1-WP06)."
requires-python = ">=3.12"
dependencies = [
  "openmcp-sdk",
  "fastmcp==2.11.3",
  "httpx==0.28.1",
  "pydantic==2.13.4",
]

[project.scripts]
mcp-ares = "mcp_ares.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
