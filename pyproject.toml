[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-ares"
version = "0.2.1"
description = "Referenčný no-secret MCP connector nad ARES (R1-WP06)."
requires-python = ">=3.12"
dependencies = [
  "openmcp-sdk>=0.2,<0.3",
  "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
# CI ich doteraz inštalovalo ad hoc v run kroku — deklarované sú overiteľné
# a `pip install -e .[test]` stačí na lokálne spustenie celej suity.
test = [
  "pytest==8.4.2",
  "pyyaml==6.0.2",
]

[project.scripts]
mcp-ares = "mcp_ares.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
